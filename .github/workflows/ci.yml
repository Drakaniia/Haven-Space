name: Checks

# Runs on every push to main and every pull request: typechecks, the D1
# migration chain, and the web build must pass. Formatting is not enforced in CI
# (run `bun run format` locally).
#
# The web app (`haven-space` Cloudflare Pages project) is deployed by the
# Cloudflare git integration (build command + `dist/pages` output dir), which
# builds every PR as a preview and every push to main as production — no
# deploy step needed in this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Typechecks & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install API dependencies
        run: bun install --cwd workers/api

      - name: Install web dependencies
        run: bun install --cwd apps/web

      - name: Typecheck API
        run: bun run cf:api:typecheck

      # Fails when a migration is renamed/renumbered or its SQL is broken: the
      # chain is applied to a throwaway local D1, so a bad migration is caught
      # here instead of leaving the deployed database behind the code.
      - name: Check migrations
        run: bun run cf:api:migrate:check

      - name: Typecheck web
        run: bun run web:typecheck

      - name: Build web
        run: bun run web:build
